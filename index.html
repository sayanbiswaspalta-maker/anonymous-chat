<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Message</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
overflow:hidden;
background:linear-gradient(-45deg,#5b21b6,#7c3aed,#9333ea,#4f46e5);
background-size:400% 400%;
animation:bg 10s ease infinite;
}
@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
.card{
width:90%;
max-width:380px;
padding:25px;
border-radius:20px;
background:rgba(255,255,255,.1);
backdrop-filter:blur(15px);
box-shadow:0 0 30px rgba(255,255,255,.15);
text-align:center;
color:#fff;
}
h2{margin-bottom:20px;font-size:30px;}
textarea{
width:100%;
height:120px;
padding:15px;
border:none;
border-radius:15px;
resize:none;
outline:none;
font-size:16px;
}
button{
margin-top:20px;
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
background:#00c8ff;
color:#fff;
cursor:pointer;
box-shadow:0 0 20px #00c8ff;
transition:.3s;
}
button:hover{
transform:scale(1.03);
box-shadow:0 0 35px #00c8ff;
}
#loading,#success{display:none;}
.loader{
margin:25px auto;
width:55px;
height:55px;
border:6px solid rgba(255,255,255,.3);
border-top:6px solid #fff;
border-radius:50%;
animation:spin 1s linear infinite;
}
@keyframes spin{
100%{transform:rotate(360deg);}
}
.tick{
width:100px;
height:100px;
margin:20px auto;
border-radius:50%;
background:#22c55e;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
box-shadow:0 0 25px #22c55e;
animation:pop .5s;
}
@keyframes pop{
0%{transform:scale(0);}
100%{transform:scale(1);}
}
#success h1{
font-size:40px;
margin:15px 0 5px;
}
#success p{
font-size:18px;
color:#eee;
}
.confetti{
position:fixed;
top:-10px;
width:8px;
height:14px;
animation:fall 4s linear forwards;
}
@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">

<div id="form">
<h2>Anonymous Message</h2>

<textarea id="message" placeholder="Type your message..."></textarea>

<button onclick="send()">✈ Send</button>
</div>

<div id="loading">
<div class="loader"></div>
<h2>Sending...</h2>
</div>

<div id="success">
<div class="tick">✓</div>
<h1>Thank You</h1>
<p>Your submission has been sent.</p>
</div>

</div>

<script>
async function send(){

const message = document.querySelector("textarea").value;

await supabase.from("messages").insert([
  { message: message }
]);

// Play a short beep sound
const audio=new(window.AudioContext||window.webkitAudioContext)();
const osc=audio.createOscillator();
const gain=audio.createGain();
osc.type="triangle";
osc.frequency.value=800;
osc.connect(gain);
gain.connect(audio.destination);
gain.gain.value=.1;
osc.start();
osc.stop(audio.currentTime+.15);

document.getElementById("form").style.display="none";
document.getElementById("loading").style.display="block";

setTimeout(()=>{
document.getElementById("loading").style.display="none";
document.getElementById("success").style.display="block";
confetti();
},1800);
}

function confetti(){
const colors=["#ff0","#0ff","#f0f","#0f0","#f00","#00f","#fff"];
for(let i=0;i<120;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=colors[Math.floor(Math.random()*colors.length)];
c.style.animationDuration=2+Math.random()*3+"s";
document.body.appendChild(c);
setTimeout(()=>c.remove(),5000);
}
}
</script>
<script 
  src="https://cdn.jsdelivr.net/npm/@supabas
  e/supabase-js@2"></script>

    const supabase =

  </script>
</body>
</html>
